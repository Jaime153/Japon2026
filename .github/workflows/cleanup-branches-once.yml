name: One-time cleanup of old branches
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Jaime153/Japon2026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to inspect the exact push
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify first addition of cleanup manifest
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" | grep -Fxq ".github/cleanup-branches-once.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Manifest was not newly added by this push; cleanup will not run."
          fi

      - name: Delete only the old named branches (never main)
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          removed=0
          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == \#* ]] && continue
            if [[ "$branch" == "main" || "$branch" != chatgpt/* ]]; then
              echo "Skipping unsafe/non-chatgpt ref: $branch"
              continue
            fi
            echo "Deleting old branch: $branch"
            if gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              removed=$((removed + 1))
            else
              echo "::warning::Could not delete branch $branch"
              failed=$((failed + 1))
            fi
          done < .github/cleanup-branches-once.txt
          echo "Removed $removed branches; failures $failed."
          [[ "$failed" -eq 0 ]]
